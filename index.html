<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Optimizer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0;
  --muted: #94a3b8; --accent: #38bdf8; --green: #4ade80; --red: #f87171;
  --orange: #fb923c; --purple: #a78bfa; --yellow: #fbbf24;
  --input-bg: #0f172a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
.container { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 4px; }
.subtitle { color: var(--muted); margin-bottom: 12px; font-size: 0.9rem; }
h2 { font-size: 1.15rem; margin: 20px 0 10px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 5px; }

/* ===== TOP BAR ===== */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.lang-switch { display: flex; gap: 4px; }
.lang-btn {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.82rem;
  font-weight: 600; transition: all 0.15s;
}
.lang-btn:hover { border-color: var(--accent); color: var(--text); }
.lang-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

/* ===== PAGE TABS ===== */
.page-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.page-tab {
  padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.9rem;
  font-weight: 600; transition: all 0.15s;
}
.page-tab:hover { border-color: var(--accent); color: var(--text); }
.page-tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.page { display: none; }
.page.active { display: block; }

/* ===== INPUT PANEL ===== */
.input-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 20px;
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
  align-items: flex-start;
}
.field { display: flex; flex-direction: column; }
.field label {
  display: block; font-size: 0.78rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.4px; margin-bottom: 6px;
}
.field input, .field select {
  width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--input-bg); color: var(--text); font-size: 1.05rem; font-weight: 600;
  font-family: 'SF Mono', Monaco, Consolas, monospace; transition: border-color 0.2s;
}
.field input:focus { outline: none; border-color: var(--accent); }
.field .unit { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

.extra-section { grid-column: 1 / -1; }
.extra-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.extra-btn {
  padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.9rem;
  transition: all 0.15s; white-space: nowrap;
}
.extra-btn:hover { border-color: var(--purple); color: var(--text); }
.extra-btn.active { background: var(--purple); color: white; border-color: var(--purple); }
.extra-input {
  width: 140px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--input-bg); color: var(--text); font-size: 0.95rem; font-weight: 600;
  font-family: 'SF Mono', Monaco, Consolas, monospace;
}
.extra-input:focus { outline: none; border-color: var(--accent); }
.extra-label { font-size: 0.8rem; color: var(--muted); }

/* ===== RESULT CARDS ===== */
.kpi-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px; margin-bottom: 16px;
}
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.kpi-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
.kpi-val { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.card.best { border-color: var(--green); box-shadow: 0 0 16px rgba(74, 222, 128, 0.08); }
.card.alt { border-color: var(--accent); box-shadow: 0 0 16px rgba(56, 189, 248, 0.08); }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-title { font-size: 0.92rem; color: var(--muted); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; }
.badge.green { background: var(--green); color: var(--bg); }
.badge.orange { background: var(--orange); color: var(--bg); }
.badge.accent { background: var(--accent); color: var(--bg); }
.badge.red { background: var(--red); color: var(--bg); }
.stat { margin-bottom: 6px; }
.stat-label { font-size: 0.78rem; color: var(--muted); }
.stat-value { font-size: 1.1rem; font-weight: 600; }
.green { color: var(--green); }
.red { color: var(--red); }
.accent-c { color: var(--accent); }

/* ===== CHARTS ===== */
.chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.chart-wrap { position: relative; height: 320px; }

/* ===== SECTION LABEL for refinance ===== */
.section-label {
  font-size: 0.78rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px;
  grid-column: 1 / -1; margin-top: 4px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
}

.footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">

<!-- ===== TOP BAR ===== -->
<div class="top-bar">
  <div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="uk">UA</button>
    <button class="lang-btn" data-lang="pl">PL</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</div>

<!-- ===== PAGE TABS ===== -->
<div class="page-tabs">
  <button class="page-tab active" data-page="downpay" id="tab_downpay"></button>
  <button class="page-tab" data-page="prepay" id="tab_prepay"></button>
  <button class="page-tab" data-page="refi" id="tab_refi"></button>
</div>

<!-- ============================================================ -->
<!-- PAGE 1: PREPAYMENT                                           -->
<!-- ============================================================ -->

</div>

<!-- ============================================================ -->
<!-- PAGE 2: DOWN PAYMENT                                         -->
<!-- ============================================================ -->
<div class="page active" id="page_downpay">

</div>

<div class="footer" id="footerText"></div>
</div>

/* ================================================================
   ENGINE
   ================================================================ */
function annuity(P, rA, n) {
  const r = rA / 12;
  return r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
}
function sim(P, rA, N, extra, strategy) {
  const r = rA / 12;
  let bal = P, pay = annuity(P, rA, N), totI = 0, totP = 0, m = 0;
  const hist = [];
  while (bal > 0.01 && m < 800) {
    m++;
    const interest = bal * r;
    let sched = Math.min(pay, bal + interest);
    let princ = Math.max(0, sched - interest);
    if (princ < 0) { princ = 0; sched = interest; }
    let ex = Math.min(extra, bal - princ); if (ex < 0) ex = 0;
    let tp = princ + ex; bal -= tp;
    if (bal < 0) { ex += bal; tp += bal; bal = 0; }
    totI += interest; totP += sched + ex;
    hist.push({ m, pay: sched + ex, interest, principal: tp, bal });
    if (bal > 0 && ex > 0 && strategy === 'pay') {
      const rem = N - m; if (rem > 0) pay = annuity(bal, rA, rem);
    }
  }
  return { totI, totP, months: m, years: +(m / 12).toFixed(1), hist, monthlyPay: annuity(P, rA, N) };
}
function simBasic(P, rA, N) { return sim(P, rA, N, 0, 'term'); }

    plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 14, padding: 16 } } },
    scales: {
      x: { title: { display: true, text: xLabel || t('ch_month'), color: '#94a3b8' }, ticks: { color: '#475569', maxTicksLimit: 20 }, grid: { color: '#1e293b' } },

  };
}

function lineDS(label, data, color, w, dash) {
  return { label, data, borderColor: color, borderWidth: w || 2, pointRadius: 0, borderDash: dash || [], fill: false };

function getP2() {
  const prop = parseFloat(document.getElementById('p2_property').value.replace(/\s/g, '')) || 0;
  const down = parseFloat(document.getElementById('p2_down').value.replace(/\s/g, '')) || 0;
  const rA = (parseFloat(document.getElementById('p2_rate').value.replace(',', '.')) || 0) / 100;
  const N = parseInt(document.getElementById('p2_payments').value) || 1;
  return { prop, down, rA, N };
}

function renderP2() {
  const { prop, down, rA, N } = getP2();
  if (prop <= 0 || rA <= 0 || N <= 0) return;
  document.getElementById('p2_yearsHint').textContent = (N / 12).toFixed(1) + ' ' + t('years');
  const pct = prop > 0 ? ((down / prop) * 100).toFixed(1) : 0;
  document.getElementById('p2_downPct').textContent = pct + '%';

  const loan = Math.max(0, prop - down);
  const yours = simBasic(loan, rA, N);
  const mp = annuity(loan, rA, N);

  // Compare scenarios: your down, 10%, 20%
  const scenarios = [
    { key: 'dp_your', down: down, color: cAccent },
    { key: 'dp_10', down: prop * 0.10, color: cOrange },
    { key: 'dp_20', down: prop * 0.20, color: cGreen }
  ];
  const sims = scenarios.map(s => {
    const l = Math.max(0, prop - s.down);
    const r = simBasic(l, rA, N);
    return { ...s, loan: l, sim: r, mp: l > 0 ? annuity(l, rA, N) : 0 };
  });

  document.getElementById('p2_kpi').innerHTML = `
    <div class="kpi"><div class="kpi-label">${t('kpi_loan')}</div><div class="kpi-val" style="color:var(--accent)">${fmt(loan)} PLN</div></div>
    <div class="kpi"><div class="kpi-label">${t('kpi_pct')}</div><div class="kpi-val">${pct}%</div></div>
    <div class="kpi"><div class="kpi-label">${t('kpi_monthly')}</div><div class="kpi-val">${fmt2(mp)}</div></div>
    <div class="kpi"><div class="kpi-label">${t('kpi_total_int')}</div><div class="kpi-val red">${fmt(yours.totI)} PLN</div></div>`;

  let cardsHtml = '';
  sims.forEach((s, i) => {
    const cls = i === 0 ? 'card alt' : 'card';
    const dpPct = prop > 0 ? ((s.down / prop) * 100).toFixed(1) : 0;
    cardsHtml += `
    <div class="${cls}">
      <div class="card-head"><span class="card-title">${t(s.key)} (${dpPct}%)</span>${i === 0 ? '<span class="badge accent">→</span>' : ''}</div>
      <div class="stat"><div class="stat-label">${t('dp_loan')}</div><div class="stat-value">${fmt(s.loan)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('dp_payment')}</div><div class="stat-value">${fmt2(s.mp)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('dp_total_int')}</div><div class="stat-value red">${fmt(s.sim.totI)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('dp_total_paid')}</div><div class="stat-value">${fmt(s.sim.totP)} PLN</div></div>
    </div>`;
  });
  document.getElementById('p2_cards').innerHTML = cardsHtml;

  // Charts
  const maxM = N;
  const step = Math.max(1, Math.floor(maxM / 120));

  // Balance chart
  destroyChart('p2b');
  const lbels = [];
  const datasets_b = [];
  for (let i = 0; i <= maxM; i += step) lbels.push(i);
  sims.forEach(s => {
    const d = lbels.map(i => s.sim.hist[i]?.bal ?? 0);
    const dpPct = prop > 0 ? ((s.down / prop) * 100).toFixed(0) : 0;
    datasets_b.push(lineDS(t(s.key) + ' (' + dpPct + '%)', d, s.color, 2));
  });
  charts.p2b = new Chart(document.getElementById('p2_chartBal'), {
    type: 'line', data: { labels: lbels, datasets: datasets_b }, options: baseChartOpts(t('ch_dp_bal'))
  });

  // Interest chart
  destroyChart('p2i');
  const datasets_i = [];
  sims.forEach(s => {
    const d = []; let cum = 0;
    for (let i = 0; i < maxM; i++) {
      if (i < s.sim.hist.length) cum += s.sim.hist[i].interest;
      if (i % step === 0) d.push(Math.round(cum));
    }
    const dpPct = prop > 0 ? ((s.down / prop) * 100).toFixed(0) : 0;
    datasets_i.push(lineDS(t(s.key) + ' (' + dpPct + '%)', d, s.color, 2));
  });
  const liInt = []; for (let i = 0; i < maxM; i += step) liInt.push(i);
  charts.p2i = new Chart(document.getElementById('p2_chartInt'), {
    type: 'line', data: { labels: liInt, datasets: datasets_i }, options: baseChartOpts(t('ch_dp_int'))
  });

  // Payment bar chart (monthly payment for each scenario)
  destroyChart('p2p');
  const payLabels = sims.map(s => { const p = prop > 0 ? ((s.down / prop) * 100).toFixed(0) : 0; return t(s.key) + ' (' + p + '%)'; });
  const payData = sims.map(s => Math.round(s.mp));
  const payColors = sims.map(s => s.color);
  charts.p2p = new Chart(document.getElementById('p2_chartPay'), {
    type: 'bar',
    data: { labels: payLabels, datasets: [{ label: t('dp_payment'), data: payData, backgroundColor: payColors.map(c => c + 'b3'), borderColor: payColors, borderWidth: 2, borderRadius: 6 }] },
    options: { ...baseChartOpts('PLN', ''), scales: { ...baseChartOpts('PLN', '').scales, x: { ...baseChartOpts('PLN', '').scales.x, title: { display: false } } } }
  });

    <div class="${c1cls}">
      <div class="card-head"><span class="card-title">${t('rf_loan1')}</span>${b1}</div>
      <div class="stat"><div class="stat-label">${t('rf_monthly')}</div><div class="stat-value">${fmt2(mp1)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_total_int')}</div><div class="stat-value ${better===1?'green':'red'}">${fmt(s1.totI)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_total_paid')}</div><div class="stat-value">${fmt(s1.totP)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_term')}</div><div class="stat-value">${n1} ${t('mo')} (${(n1/12).toFixed(1)} ${t('yr')})</div></div>
    </div>
    <div class="${c2cls}">
      <div class="card-head"><span class="card-title">${t('rf_loan2')}</span>${b2}</div>
      <div class="stat"><div class="stat-label">${t('rf_monthly')}</div><div class="stat-value">${fmt2(mp2)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_total_int')}</div><div class="stat-value ${better===2?'green':'red'}">${fmt(s2.totI)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_total_paid')}</div><div class="stat-value">${fmt(s2.totP)} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_term')}</div><div class="stat-value">${n2} ${t('mo')} (${(n2/12).toFixed(1)} ${t('yr')})</div></div>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">${t('rf_diff')}</span></div>
      <div class="stat"><div class="stat-label">${t('rf_save_monthly')}</div><div class="stat-value green">${fmt(Math.abs(Math.round(diffMo)))} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_save_int')}</div><div class="stat-value green">${fmt(Math.abs(diffInt))} PLN</div></div>
      <div class="stat"><div class="stat-label">${t('rf_save_total')}</div><div class="stat-value green">${fmt(Math.abs(diffTot))} PLN</div></div>
    </div>`;

  // Charts
  const maxM = Math.max(n1, n2);
  const step = Math.max(1, Math.floor(maxM / 120));

  // Balance
  destroyChart('p3b');
  const lb = [], d1 = [], d2 = [];
  for (let i = 0; i <= maxM; i += step) { lb.push(i); d1.push(s1.hist[i]?.bal ?? 0); d2.push(s2.hist[i]?.bal ?? 0); }
  charts.p3b = new Chart(document.getElementById('p3_chartBal'), {
    type: 'line', data: { labels: lb, datasets: [lineDS(t('ch_loan1'), d1, cRed, 2), lineDS(t('ch_loan2'), d2, cGreen, 2.5)] },
    options: baseChartOpts(t('ch_balance'))
  });

  // Interest
  destroyChart('p3i');
  const li = [], di1 = [], di2 = [];
  let c1 = 0, c2 = 0;
  for (let i = 0; i < maxM; i++) {
    if (i < s1.hist.length) c1 += s1.hist[i].interest;
    if (i < s2.hist.length) c2 += s2.hist[i].interest;
    if (i % step === 0) { li.push(i); di1.push(Math.round(c1)); di2.push(Math.round(c2)); }
  }
  charts.p3i = new Chart(document.getElementById('p3_chartInt'), {
    type: 'line', data: { labels: li, datasets: [lineDS(t('ch_loan1'), di1, cRed, 2), lineDS(t('ch_loan2'), di2, cGreen, 2.5)] },
    options: baseChartOpts(t('ch_cum_int'))
  });

  // Payment structure — grouped stacked bars side by side
  destroyChart('p3p');
  const stp = Math.max(1, Math.floor(maxM / 25));
  const lp = [], int1 = [], pr1 = [], int2 = [], pr2 = [];
  for (let i = 0; i < maxM; i += stp) {
    lp.push(i + 1);
    const h1 = s1.hist[i] || { interest: 0, principal: 0 };
    const h2 = s2.hist[i] || { interest: 0, principal: 0 };
    int1.push(Math.round(h1.interest)); pr1.push(Math.round(h1.principal));
    int2.push(Math.round(h2.interest)); pr2.push(Math.round(h2.principal));
  }
  charts.p3p = new Chart(document.getElementById('p3_chartPay'), {
    type: 'bar',
    data: { labels: lp, datasets: [
      { label: t('ch_loan1') + ' — ' + t('ch_interest'), data: int1, backgroundColor: 'rgba(248,113,113,0.7)', borderRadius: 2, stack: 'loan1' },
      { label: t('ch_loan1') + ' — ' + t('ch_principal'), data: pr1, backgroundColor: 'rgba(248,113,113,0.3)', borderRadius: 2, stack: 'loan1' },
      { label: t('ch_loan2') + ' — ' + t('ch_interest'), data: int2, backgroundColor: 'rgba(74,222,128,0.7)', borderRadius: 2, stack: 'loan2' },
      { label: t('ch_loan2') + ' — ' + t('ch_principal'), data: pr2, backgroundColor: 'rgba(74,222,128,0.3)', borderRadius: 2, stack: 'loan2' }
    ]},
    options: {
      ...baseChartOpts('PLN'),
      scales: {
        x: { ...baseChartOpts('PLN').scales.x, stacked: true },
        y: { ...baseChartOpts('PLN').scales.y, stacked: true }
      }
    }
  });
}

/* ================================================================
   EVENTS
   ================================================================ */
let debounce;
function onInput() { clearTimeout(debounce); debounce = setTimeout(renderCurrent, 200); }

// Lang buttons
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// Page tabs
document.querySelectorAll('.page-tab').forEach(b => b.addEventListener('click', () => setPage(b.dataset.page)));

// P1 inputs
['p1_principal', 'p1_rate', 'p1_payments'].forEach(id => document.getElementById(id).addEventListener('input', onInput));
document.getElementById('p1_extra').addEventListener('input', function () {
  document.querySelectorAll('.extra-btn').forEach(b => b.classList.remove('active'));
  if ([500, 1000, 1500, 2000].includes(parseInt(this.value)))
    document.querySelector(`.extra-btn[data-val="${parseInt(this.value)}"]`)?.classList.add('active');
  onInput();
});
document.querySelectorAll('.extra-btn').forEach(btn => {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.extra-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('p1_extra').value = this.dataset.val;
    onInput();
  });
});

// P2 inputs
['p2_property', 'p2_down', 'p2_rate', 'p2_payments'].forEach(id => document.getElementById(id).addEventListener('input', onInput));

// P3 inputs
['p3_principal', 'p3_rate1', 'p3_rate2', 'p3_pay1', 'p3_pay2'].forEach(id => document.getElementById(id).addEventListener('input', onInput));

/* ================================================================
   INIT
   ================================================================ */
applyAllLabels();
renderP2();
</script>
</body>
</html>
